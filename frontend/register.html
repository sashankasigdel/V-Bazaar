<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — Bazaar</title>
<link rel="stylesheet" href="/css/main.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-visual">
    <div class="auth-visual-content">
      <div style="display:flex;align-items:center;gap:0.7rem;font-family:var(--font-display);font-size:2.5rem;color:var(--saffron);margin-bottom:2rem;"><img src="/images/icon-192.png" alt="V-Bazaar" style="width:48px;height:48px;border-radius:13px;object-fit:cover;">V-Bazaar</div>
      <h2 style="color:white;font-size:2rem;margin-bottom:1rem;">Join thousands of locals on Bazaar</h2>
      <p style="color:rgba(255,255,255,0.6);font-size:0.95rem;line-height:1.7;">Whether you're a customer or a business — Bazaar is built for you.</p>
      <div style="margin-top:3rem;display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
        <div style="background:rgba(255,255,255,0.06);border-radius:12px;padding:1.25rem;border:1px solid rgba(255,255,255,0.1);">
          <div style="font-size:1.8rem;margin-bottom:0.5rem;">🧑</div>
          <div style="color:white;font-weight:600;font-size:0.9rem;">Customers</div>
          <div style="color:rgba(255,255,255,0.5);font-size:0.8rem;margin-top:0.25rem;">Browse, order, review</div>
        </div>
        <div style="background:rgba(255,255,255,0.06);border-radius:12px;padding:1.25rem;border:1px solid rgba(255,255,255,0.1);">
          <div style="font-size:1.8rem;margin-bottom:0.5rem;">🏪</div>
          <div style="color:white;font-weight:600;font-size:0.9rem;">Businesses</div>
          <div style="color:rgba(255,255,255,0.5);font-size:0.8rem;margin-top:0.25rem;">Sell, manage, grow</div>
        </div>
      </div>
    </div>
  </div>
  <div class="auth-form-side">
    <div class="auth-form-wrapper">
      <a href="/" class="auth-logo"><img src="/images/icon-192.png" alt="V-Bazaar" style="width:40px;height:40px;border-radius:11px;object-fit:cover;">V-Bazaar</a>
      <h1 class="auth-title">Create your account</h1>
      <div style="display:flex;background:var(--cream-dark);border-radius:999px;padding:4px;margin-bottom:1.75rem;">
        <button id="tab-c" onclick="setRole('customer')" style="flex:1;padding:0.5rem;border-radius:999px;font-size:0.875rem;font-weight:600;background:white;color:var(--slate);box-shadow:var(--shadow-sm);transition:all 0.2s;">🧑 Customer</button>
        <button id="tab-o" onclick="setRole('business_owner')" style="flex:1;padding:0.5rem;border-radius:999px;font-size:0.875rem;font-weight:600;background:transparent;color:var(--slate-mid);transition:all 0.2s;">🏪 Business Owner</button>
      </div>
      <div id="err" style="display:none;background:#FFEBEE;color:#C62828;border-radius:var(--radius-sm);padding:0.875rem 1rem;margin-bottom:1.25rem;font-size:0.875rem;"></div>
      <form onsubmit="handleRegister(event)">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
          <div class="form-group" style="margin-bottom:0;"><label class="form-label">First Name</label><input type="text" id="fn" class="form-input" placeholder="Ram" required></div>
          <div class="form-group" style="margin-bottom:0;"><label class="form-label">Last Name</label><input type="text" id="ln" class="form-input" placeholder="Sharma" required></div>
        </div>
        <div class="form-group" style="margin-top:1rem;"><label class="form-label">Email Address</label><input type="email" id="email" class="form-input" placeholder="you@example.com" required></div>
        <div class="form-group"><label class="form-label">Username</label><input type="text" id="uname" class="form-input" placeholder="ramsharma" required></div>
        <div class="form-group"><label class="form-label">Phone</label><input type="tel" id="phone" class="form-input" placeholder="98XXXXXXXX"></div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <div style="position:relative;"><input type="password" id="pwd" class="form-input" placeholder="At least 8 characters" required style="padding-right:2.5rem;"><button type="button" onclick="togglePwd('pwd')" style="position:absolute;right:0.75rem;top:50%;transform:translateY(-50%);color:var(--slate-light);">👁</button></div>
        </div>
        <div class="form-group"><label class="form-label">Confirm Password</label><input type="password" id="pwd2" class="form-input" placeholder="Repeat password" required></div>
        <input type="hidden" id="role" value="customer">
        <button type="submit" id="submit-btn" class="btn btn-primary btn-lg" style="width:100%;justify-content:center;">Create Account</button>
      </form>
      <div class="auth-divider">or continue with</div>
      <div id="google-btn" style="display:flex;justify-content:center;"></div>
      <div class="auth-switch">Already have an account? <a href="/login/">Sign in →</a></div>
    </div>
  </div>
</div>
<div class="toast-container"></div>
<script src="/js/app.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer onload="initGoogleSignIn('google-btn', () => document.getElementById('role').value)"></script>
<script>
if (Auth.isLoggedIn()) window.location.href = '/';
function togglePwd(id) { const i = document.getElementById(id); i.type = i.type === 'password' ? 'text' : 'password'; }
function setRole(role) {
  document.getElementById('role').value = role;
  const isC = role === 'customer';
  document.getElementById('tab-c').style.cssText = isC ? 'flex:1;padding:0.5rem;border-radius:999px;font-size:0.875rem;font-weight:600;background:white;color:var(--slate);box-shadow:var(--shadow-sm);transition:all 0.2s;' : 'flex:1;padding:0.5rem;border-radius:999px;font-size:0.875rem;font-weight:600;background:transparent;color:var(--slate-mid);transition:all 0.2s;';
  document.getElementById('tab-o').style.cssText = !isC ? 'flex:1;padding:0.5rem;border-radius:999px;font-size:0.875rem;font-weight:600;background:white;color:var(--slate);box-shadow:var(--shadow-sm);transition:all 0.2s;' : 'flex:1;padding:0.5rem;border-radius:999px;font-size:0.875rem;font-weight:600;background:transparent;color:var(--slate-mid);transition:all 0.2s;';
}
async function handleRegister(e) {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  const err = document.getElementById('err');
  err.style.display = 'none';
  if (document.getElementById('pwd').value !== document.getElementById('pwd2').value) { err.textContent = 'Passwords do not match.'; err.style.display = 'block'; return; }
  btn.textContent = 'Creating...'; btn.disabled = true;
  const resp = await API.register({
    first_name: document.getElementById('fn').value,
    last_name: document.getElementById('ln').value,
    email: document.getElementById('email').value,
    username: document.getElementById('uname').value,
    phone: document.getElementById('phone').value,
    password: document.getElementById('pwd').value,
    password2: document.getElementById('pwd2').value,
    role: document.getElementById('role').value,
  });
  if (resp.ok) {
    Auth.setTokens(resp.data.access, resp.data.refresh);
    Auth.setUser(resp.data.user);
    UI.toast('Welcome to Bazaar! 🎉', 'success');
    setTimeout(() => { window.location.href = resp.data.user.role === 'business_owner' ? '/business-dashboard/' : '/'; }, 800);
  } else {
    const msgs = Object.entries(resp.data).map(([k,v]) => `${Array.isArray(v) ? v[0] : v}`).join(' | ');
    err.textContent = msgs || 'Registration failed.';
    err.style.display = 'block';
    btn.textContent = 'Create Account'; btn.disabled = false;
  }
}
</script>
</body>
</html>
