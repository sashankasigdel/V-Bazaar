<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — V-Bazaar</title>
<link rel="stylesheet" href="/css/main.css">
<style>
body { background: #0F1623; }
.admin-login-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
.admin-login-box { background: #1A2332; border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 3rem; max-width: 400px; width: 100%; }
.admin-login-logo { text-align: center; margin-bottom: 2rem; }
.admin-login-logo .icon { font-size: 2.5rem; margin-bottom: 0.5rem; }
.admin-login-logo h1 { font-family: var(--font-display); font-size: 1.5rem; color: var(--saffron); }
.admin-login-logo p { color: rgba(255,255,255,0.4); font-size: 0.82rem; margin-top: 0.25rem; }
.admin-input-group { margin-bottom: 1.25rem; }
.admin-input-group label { display: block; font-size: 0.82rem; color: rgba(255,255,255,0.6); margin-bottom: 0.5rem; font-weight: 500; }
.admin-input-field { width: 100%; background: rgba(255,255,255,0.05); border: 1.5px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 0.75rem 1rem; color: white; font-size: 0.9rem; font-family: var(--font-body); }
.admin-input-field:focus { outline: none; border-color: var(--saffron); background: rgba(255,255,255,0.08); }
.admin-login-btn { width: 100%; background: var(--saffron); color: white; border: none; padding: 0.85rem; border-radius: 10px; font-size: 0.95rem; font-weight: 700; cursor: pointer; transition: all 0.2s; margin-top: 0.5rem; }
.admin-login-btn:hover { background: var(--saffron-dark); }
.admin-login-btn:disabled { opacity: 0.6; cursor: not-allowed; }
.admin-error { background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3); color: #F87171; padding: 0.75rem 1rem; border-radius: 8px; font-size: 0.85rem; margin-bottom: 1.25rem; display: none; }
.admin-footer-note { text-align: center; margin-top: 1.5rem; font-size: 0.78rem; color: rgba(255,255,255,0.25); }
</style>
</head>
<body>
<div class="admin-login-page">
  <div class="admin-login-box">
    <div class="admin-login-logo">
      <div class="icon">🛡️</div>
      <h1>V-Bazaar Admin</h1>
      <p>Restricted access — authorized personnel only</p>
    </div>

    <div id="err" class="admin-error"></div>

    <form onsubmit="handleAdminLogin(event)">
      <div class="admin-input-group">
        <label>Admin Email</label>
        <input type="email" id="email" class="admin-input-field" placeholder="admin@bazaar.com" required autocomplete="email">
      </div>
      <div class="admin-input-group">
        <label>Password</label>
        <input type="password" id="password" class="admin-input-field" placeholder="Enter password" required autocomplete="current-password">
      </div>
      <button type="submit" id="btn" class="admin-login-btn">Access Admin Panel</button>
    </form>

    <div class="admin-footer-note">This portal is separate from the customer site.</div>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
// If already have valid admin session, go straight in
const adminToken = localStorage.getItem('admin_access_token');
const adminUser = JSON.parse(localStorage.getItem('admin_user') || 'null');
if (adminToken && adminUser && (adminUser.role === 'admin' || adminUser.is_staff)) {
  window.location.href = '/admin-dashboard/';
}

async function handleAdminLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('btn');
  const err = document.getElementById('err');
  err.style.display = 'none';
  btn.textContent = 'Verifying...'; btn.disabled = true;

  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;

  const resp = await fetch('/api/auth/login/', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password }),
  });
  const data = await resp.json();

  if (resp.ok) {
    // Verify user profile to check admin role
    const profResp = await fetch('/api/auth/profile/', {
      headers: { 'Authorization': `Bearer ${data.access}` },
    });
    const profile = await profResp.json();

    if (profile.role !== 'admin' && !profile.is_staff) {
      err.textContent = 'This account does not have admin access.';
      err.style.display = 'block';
      btn.textContent = 'Access Admin Panel'; btn.disabled = false;
      return;
    }

    // Store admin-specific tokens (separate from customer tokens)
    localStorage.setItem('admin_access_token', data.access);
    localStorage.setItem('admin_refresh_token', data.refresh);
    localStorage.setItem('admin_user', JSON.stringify(profile));

    window.location.href = '/admin-dashboard/';
  } else {
    err.textContent = data.detail || 'Invalid email or password.';
    err.style.display = 'block';
    btn.textContent = 'Access Admin Panel'; btn.disabled = false;
  }
}
</script>
</body>
</html>
