<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Explore — V-Bazaar</title>
<link rel="stylesheet" href="/css/main.css">
<style>
body{background:var(--cream);}
.filter-section{margin-bottom:1.25rem;padding-bottom:1.25rem;border-bottom:1px solid var(--border-light);}
.filter-section:last-child{margin-bottom:0;padding-bottom:0;border-bottom:none;}
.filter-label{font-weight:700;font-size:0.85rem;color:var(--charcoal);margin-bottom:0.65rem;display:block;}
html[data-theme="dark"] body{background:#1F2222;}
html[data-theme="dark"] .filter-label{color:#F0F0F0;}
</style>
</head>
<body>
<nav class="vb-nav" id="vb-nav"></nav>

<div class="container" style="padding-top:1.5rem;padding-bottom:4rem;">
  <div class="vb-filter-toggle-bar" id="filter-toggle" onclick="toggleFilterPanel()">
    <div class="vb-filter-toggle-left"><span id="ic-filter-toggle"></span> Filters <span class="vb-filter-toggle-count" id="filter-count" style="display:none;"></span></div>
    <span class="vb-filter-chevron" id="ic-filter-chevron"></span>
  </div>
  <div class="vb-filter-panel" id="filter-panel">
    <div class="vb-filter-panel-inner">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.1rem;">
        <h3 style="font-family:var(--font-body);font-size:1rem;font-weight:700;color:var(--charcoal);">Filters</h3>
        <button onclick="clearFilters()" style="font-size:0.8rem;color:var(--saffron);font-weight:600;">Clear all</button>
      </div>
      <div class="filter-section">
        <span class="filter-label">Category</span>
        <div id="cat-filters" style="display:flex;flex-wrap:wrap;gap:0.5rem;"></div>
      </div>
      <div class="filter-section">
        <span class="filter-label">Minimum Rating</span>
        <div style="display:flex;flex-wrap:wrap;gap:0.5rem;">
          <label class="vb-filter-check"><input type="radio" name="rating" value="" onchange="doSearch()" checked> Any rating</label>
          <label class="vb-filter-check"><input type="radio" name="rating" value="4" onchange="doSearch()"> ⭐ 4+ stars</label>
          <label class="vb-filter-check"><input type="radio" name="rating" value="3" onchange="doSearch()"> ⭐ 3+ stars</label>
        </div>
      </div>
      <div class="filter-section">
        <span class="filter-label">Status</span>
        <div style="display:flex;flex-wrap:wrap;gap:0.5rem;">
          <label class="vb-filter-check"><input type="checkbox" id="open-now" onchange="doSearch()"> Open right now</label>
          <label class="vb-filter-check"><input type="checkbox" id="featured-only" onchange="doSearch()"> Featured only</label>
        </div>
      </div>
      <button onclick="doSearch();closeFilterPanelMobile();" class="btn btn-primary" style="width:100%;justify-content:center;">Show Results</button>
    </div>
  </div>

  <div style="display:flex;justify-content:space-between;align-items:center;margin:1.25rem 0 1.5rem;flex-wrap:wrap;gap:1rem;">
    <div>
      <h2 id="heading" style="font-family:var(--font-body);font-weight:700;font-size:1.25rem;color:var(--charcoal);"></h2>
      <p id="count" style="font-size:0.875rem;color:var(--slate-light);margin:0;"></p>
    </div>
    <div class="vb-filter-select-wrap">
      <span id="ic-sort"></span>
      <select class="vb-filter-select" onchange="ordering=this.value;doSearch()">
        <option value="-average_rating">Top Rated</option>
        <option value="-total_orders">Most Popular</option>
        <option value="-created_at">Newest</option>
      </select>
    </div>
  </div>
  <div id="results" class="vb-card-grid"></div>
  <div id="no-results" style="display:none;" class="empty-state"><div class="empty-icon">🔍</div><h3>No results found</h3><p>Try different keywords or remove some filters.</p><a href="/" class="btn btn-primary" style="margin-top:1rem;">Browse All</a></div>
  <div style="text-align:center;margin-top:2rem;" id="load-more"></div>
</div>

<div class="toast-container"></div>
<script src="/js/app.js"></script>
<script>
let query = new URLSearchParams(window.location.search).get('q') || '';
let ordering = '-average_rating';
let page = 1;
const userLoc = Location.get();

document.getElementById('ic-sort').innerHTML = plainIcon('filter', 14);
document.getElementById('ic-filter-toggle').innerHTML = plainIcon('filter', 15);
document.getElementById('ic-filter-chevron').innerHTML = plainIcon('chevronDown', 16);

function toggleFilterPanel() {
  document.getElementById('filter-toggle').classList.toggle('open');
  document.getElementById('filter-panel').classList.toggle('open');
}
function closeFilterPanelMobile() {
  document.getElementById('filter-toggle').classList.remove('open');
  document.getElementById('filter-panel').classList.remove('open');
}

async function init() {
  renderVbNavbar('vb-nav', { exploreActive: true, searchValue: query });
  await loadCats();
  // Pre-select category from URL — filter panel stays collapsed (mobile) so the
  // user lands directly on the already-filtered results, not a wall of filters.
  const cat = new URLSearchParams(window.location.search).get('category');
  if (cat) { const inp = document.querySelector(`input[value="${cat}"]`); if (inp) inp.checked = true; }
  doSearch();
}

async function loadCats() {
  const resp = await API.getCategories();
  if (!resp.ok) return;
  document.getElementById('cat-filters').innerHTML = (resp.data.results || resp.data).map(c =>
    `<label class="vb-filter-check"><input type="checkbox" name="cat" value="${c.slug}" onchange="doSearch()"> ${categoryIcon(c.slug, 15)} ${c.name}</label>`
  ).join('');
}

function updateFilterCount() {
  let n = document.querySelectorAll('input[name=cat]:checked').length;
  if (document.querySelector('input[name=rating]:checked')?.value) n++;
  if (document.getElementById('open-now').checked) n++;
  if (document.getElementById('featured-only').checked) n++;
  const el = document.getElementById('filter-count');
  el.textContent = n; el.style.display = n > 0 ? 'inline-block' : 'none';
}

async function doSearch(append = false) {
  updateFilterCount();
  const grid = document.getElementById('results');
  if (!append) { UI.loading(grid); document.getElementById('no-results').style.display = 'none'; }
  const p = { search: query, ordering, page };
  const cats = [...document.querySelectorAll('input[name=cat]:checked')].map(i => i.value);
  if (cats.length === 1) p.category = cats[0];
  const rating = document.querySelector('input[name=rating]:checked')?.value;
  if (rating) p.min_rating = rating;
  if (document.getElementById('open-now')?.checked) p.open_now = 'true';
  if (document.getElementById('featured-only')?.checked) p.is_featured = 'true';
  if (userLoc) { p.lat = userLoc.lat; p.lon = userLoc.lon; }
  const resp = await API.getBusinesses(p);
  const bizs = resp.data?.results || resp.data || [];
  const total = resp.data?.count || bizs.length;
  document.getElementById('heading').textContent = query ? `Results for "${query}"` : 'All Businesses';
  document.getElementById('count').textContent = `${total} business${total !== 1 ? 'es' : ''} found`;
  if (!bizs.length && !append) { grid.innerHTML = ''; document.getElementById('no-results').style.display = 'block'; document.getElementById('load-more').innerHTML = ''; return; }
  const html = bizs.map(b => renderVbCard(b, false, userLoc?.lat, userLoc?.lon)).join('');
  if (append) grid.innerHTML += html; else grid.innerHTML = html;
  document.getElementById('load-more').innerHTML = resp.data?.next ? `<button class="btn btn-secondary" onclick="page++;doSearch(true)">Load More</button>` : '';
}

function clearFilters() {
  document.querySelectorAll('input[name=cat]').forEach(i => i.checked = false);
  document.querySelector('input[name=rating][value=""]').checked = true;
  document.getElementById('open-now').checked = false;
  document.getElementById('featured-only').checked = false;
  page = 1; doSearch();
}

init();
</script>
</body>
</html>
