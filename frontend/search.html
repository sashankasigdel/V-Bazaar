<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search — Bazaar</title>
<link rel="stylesheet" href="/css/main.css">
<style>
.filter-sidebar{background:white;border-radius:var(--radius-lg);border:1px solid var(--border);padding:1.5rem;position:sticky;top:80px;}
.filter-section{margin-bottom:1.5rem;padding-bottom:1.5rem;border-bottom:1px solid var(--border-light);}
.filter-section:last-child{margin-bottom:0;padding-bottom:0;border-bottom:none;}
.filter-label{font-weight:700;font-size:0.875rem;color:var(--slate);margin-bottom:0.75rem;display:block;}
.filter-opt{display:flex;align-items:center;gap:0.5rem;padding:0.35rem 0;cursor:pointer;font-size:0.875rem;color:var(--slate-mid);}
.filter-opt input{accent-color:var(--saffron);width:16px;height:16px;}
input[type=range]{width:100%;accent-color:var(--saffron);}
</style>
</head>
<body>
<nav class="navbar">
  <a href="/" class="navbar-brand">Bazaar<span class="brand-dot">.</span></a>
  <div class="navbar-search" style="flex:1;max-width:600px;">
    <span class="search-icon">🔍</span>
    <input type="text" id="search-input" placeholder="Search businesses, products, services...">
  </div>
  <div class="navbar-actions">
    <span data-guest-only><a href="/login/" class="btn-nav">Sign in</a></span>
    <span data-auth-required style="display:none;"><a href="/dashboard/#profile" class="btn-nav">👤 My Profile</a> <a href="/business-dashboard/" class="btn-nav" data-owner-only style="display:none;background:var(--emerald);">🏪 My Business</a></span>
  </div>
</nav>

<div class="container" style="padding-top:2rem;padding-bottom:4rem;">
  <div style="display:grid;grid-template-columns:260px 1fr;gap:2rem;align-items:start;">
    <div class="filter-sidebar">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem;">
        <h3 style="font-family:var(--font-body);font-size:1rem;font-weight:700;">Filters</h3>
        <button onclick="clearFilters()" style="font-size:0.8rem;color:var(--saffron);font-weight:600;">Clear all</button>
      </div>
      <div class="filter-section">
        <span class="filter-label">Category</span>
        <div id="cat-filters"></div>
      </div>
      <div class="filter-section">
        <span class="filter-label">Minimum Rating</span>
        <label class="filter-opt"><input type="radio" name="rating" value="" onchange="doSearch()" checked> Any rating</label>
        <label class="filter-opt"><input type="radio" name="rating" value="4" onchange="doSearch()"> ⭐ 4+ stars</label>
        <label class="filter-opt"><input type="radio" name="rating" value="3" onchange="doSearch()"> ⭐ 3+ stars</label>
      </div>
      <div class="filter-section">
        <span class="filter-label">Status</span>
        <label class="filter-opt"><input type="checkbox" id="open-now" onchange="doSearch()"> Open right now</label>
        <label class="filter-opt"><input type="checkbox" id="featured-only" onchange="doSearch()"> Featured only</label>
      </div>
      <button onclick="doSearch()" class="btn btn-primary" style="width:100%;justify-content:center;">Apply Filters</button>
    </div>

    <div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;flex-wrap:wrap;gap:1rem;">
        <div>
          <h2 id="heading" style="font-family:var(--font-body);font-weight:700;font-size:1.25rem;"></h2>
          <p id="count" style="font-size:0.875rem;color:var(--slate-light);margin:0;"></p>
        </div>
        <select class="form-input" style="width:auto;" onchange="ordering=this.value;doSearch()">
          <option value="-average_rating">Top Rated</option>
          <option value="-total_orders">Most Popular</option>
          <option value="-created_at">Newest</option>
        </select>
      </div>
      <div id="results" class="grid-3" style="grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1.25rem;"></div>
      <div id="no-results" style="display:none;" class="empty-state"><div class="empty-icon">🔍</div><h3>No results found</h3><p>Try different keywords or remove some filters.</p><a href="/" class="btn btn-primary" style="margin-top:1rem;">Browse All</a></div>
      <div style="text-align:center;margin-top:2rem;" id="load-more"></div>
    </div>
  </div>
</div>

<div class="toast-container"></div>
<script src="/js/app.js"></script>
<script>
let query = new URLSearchParams(window.location.search).get('q') || '';
let ordering = '-average_rating';
let page = 1;
const userLoc = Location.get();

document.getElementById('search-input').value = query;
document.getElementById('search-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') { query = e.target.value; page = 1; doSearch(); history.replaceState({}, '', `?q=${encodeURIComponent(query)}`); }
});

async function init() {
  await loadCats();
  // Pre-select category from URL
  const cat = new URLSearchParams(window.location.search).get('category');
  if (cat) { const inp = document.querySelector(`input[value="${cat}"]`); if (inp) inp.checked = true; }
  doSearch();
}

async function loadCats() {
  const resp = await API.getCategories();
  if (!resp.ok) return;
  document.getElementById('cat-filters').innerHTML = (resp.data.results || resp.data).map(c =>
    `<label class="filter-opt"><input type="checkbox" name="cat" value="${c.slug}" onchange="doSearch()"> ${categoryIcon(c.slug, 16)} ${c.name}</label>`
  ).join('');
}

async function doSearch(append = false) {
  const grid = document.getElementById('results');
  if (!append) { UI.loading(grid); document.getElementById('no-results').style.display = 'none'; }
  const p = { search: query, ordering, page };
  const cats = [...document.querySelectorAll('input[name=cat]:checked')].map(i => i.value);
  if (cats.length === 1) p.category = cats[0];
  const rating = document.querySelector('input[name=rating]:checked')?.value;
  if (rating) p.min_rating = rating;
  if (document.getElementById('open-now')?.checked) p.open_now = 'true';
  if (document.getElementById('featured-only')?.checked) p.is_featured = 'true';
  if (userLoc) { p.lat = userLoc.lat; p.lon = userLoc.lon; }
  const resp = await API.getBusinesses(p);
  const bizs = resp.data?.results || resp.data || [];
  const total = resp.data?.count || bizs.length;
  document.getElementById('heading').textContent = query ? `Results for "${query}"` : 'All Businesses';
  document.getElementById('count').textContent = `${total} business${total !== 1 ? 'es' : ''} found`;
  if (!bizs.length && !append) { grid.innerHTML = ''; document.getElementById('no-results').style.display = 'block'; document.getElementById('load-more').innerHTML = ''; return; }
  const html = bizs.map(b => renderBusinessCard(b, userLoc?.lat, userLoc?.lon)).join('');
  if (append) grid.innerHTML += html; else grid.innerHTML = html;
  document.getElementById('load-more').innerHTML = resp.data?.next ? `<button class="btn btn-secondary" onclick="page++;doSearch(true)">Load More</button>` : '';
}

function clearFilters() {
  document.querySelectorAll('input[name=cat]').forEach(i => i.checked = false);
  document.querySelector('input[name=rating][value=""]').checked = true;
  document.getElementById('open-now').checked = false;
  document.getElementById('featured-only').checked = false;
  page = 1; doSearch();
}

init();
</script>
</body>
</html>
