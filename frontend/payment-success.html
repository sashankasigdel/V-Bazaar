<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Success — Bazaar</title>
<link rel="stylesheet" href="/css/main.css">
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--cream);">
<div style="text-align:center;padding:3rem;background:white;border-radius:var(--radius-xl);border:1px solid var(--border);max-width:440px;width:90%;box-shadow:var(--shadow-lg);">
  <div style="font-size:4rem;margin-bottom:1rem;">✅</div>
  <h1 style="font-size:1.75rem;margin-bottom:0.5rem;">Payment Successful!</h1>
  <p style="color:var(--slate-mid);margin-bottom:2rem;">Your order has been confirmed and is being processed.</p>
  <a href="/dashboard/" class="btn btn-primary btn-lg" style="justify-content:center;width:100%;margin-bottom:0.75rem;">Track My Order →</a>
  <a href="/" class="btn btn-secondary" style="justify-content:center;width:100%;">Continue Shopping</a>
</div>
<script src="/js/app.js"></script>
</body>
</html>
