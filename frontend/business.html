<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business — V-Bazaar</title>
<link rel="stylesheet" href="/css/main.css">
<style>
body{background:var(--cream);}
#biz-banner-wrap{height:300px;}
#logo{width:80px;height:80px;font-size:2rem;margin-top:-40px;}
#biz-name{font-size:1.75rem;}
@media(max-width:600px){
  #biz-banner-wrap{height:170px;}
  #logo{width:64px;height:64px;margin-top:-32px;font-size:1.6rem;}
  #biz-name{font-size:1.35rem;}
}
.vb-name-row{display:flex;align-items:center;gap:0.6rem;flex-wrap:wrap;margin-bottom:0.4rem;}
.vb-name-row h1{margin-bottom:0;}
.vb-pills-row{display:flex;gap:0.6rem;flex-wrap:wrap;margin-bottom:0.5rem;}

/* Action icons (Call/WhatsApp/Directions/Save) + Outlet Info sit side by side,
   right below the description, as a strict 50/50 split (grid, not flex, so
   neither side can grow/shrink relative to the other regardless of content). */
.vb-action-outlet-row{display:grid;grid-template-columns:1fr 1fr;gap:0.9rem;align-items:start;margin-top:1.1rem;}
.vb-action-grid{display:grid;grid-template-columns:repeat(2,1fr);grid-auto-rows:min-content;align-content:start;gap:0.7rem;min-width:0;}
.vb-outlet-box{min-width:0;}
.vb-action-btn{width:100%;aspect-ratio:1;border-radius:var(--radius-md);border:1.5px solid var(--border);background:white;display:flex;align-items:center;justify-content:center;color:var(--charcoal);transition:all var(--transition);}
.vb-action-btn:hover{border-color:var(--saffron);background:var(--saffron-light);color:var(--saffron-dark);}
.vb-action-btn.saved{color:var(--saffron);border-color:var(--saffron);background:var(--saffron-light);}
.vb-outlet-box h4{font-family:var(--font-body);margin-bottom:0.6rem;}

/* Orders / Appointment / Booking — a fixed, collapsible bottom bar that only
   appears once there's something in the cart for this business (per the
   "expandable/collapsible/fixed if there is any order placed" spec). */
.vb-order-bar{position:fixed;left:0;right:0;bottom:0;z-index:90;background:white;border-top:1px solid var(--border);border-radius:var(--radius-lg) var(--radius-lg) 0 0;box-shadow:0 -6px 20px rgba(26,35,50,0.12);max-width:640px;margin:0 auto;max-height:75vh;display:flex;flex-direction:column;}
.vb-order-bar-header{display:flex;align-items:center;justify-content:space-between;gap:0.75rem;padding:0.9rem 1.25rem;cursor:pointer;}
.vb-order-bar-header h4{font-family:var(--font-body);font-size:0.95rem;}
.vb-order-bar-summary{font-size:0.8rem;color:var(--saffron-dark);font-weight:700;white-space:nowrap;}
.vb-order-bar-chev{transition:transform var(--transition);color:var(--slate-light);flex-shrink:0;}
.vb-order-bar.open .vb-order-bar-chev{transform:rotate(180deg);}
.vb-order-bar-body{display:none;overflow-y:auto;padding:0 1.25rem 1.25rem;border-top:1px solid var(--border-light);}
.vb-order-bar.open .vb-order-bar-body{display:block;padding-top:1rem;}

.vb-prod-group-title{font-family:var(--font-body);font-weight:700;font-size:1rem;color:var(--charcoal);margin:1.5rem 0 0.9rem;}
.vb-prod-group-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1rem;margin-bottom:0.5rem;}
.vb-branch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1.1rem;}
.vb-branch-card{display:flex;flex-direction:column;align-items:center;text-align:center;gap:0.6rem;padding:1.1rem 0.75rem;border-radius:var(--radius-md);border:1.5px solid var(--border);background:white;color:inherit;transition:all var(--transition);}
.vb-branch-card:hover{border-color:var(--saffron);background:var(--saffron-light);}
.vb-branch-photo{width:72px;height:72px;border-radius:50%;background:var(--saffron-light);color:var(--saffron-dark);overflow:hidden;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.vb-branch-photo img{width:100%;height:100%;object-fit:cover;}
.vb-branch-name{font-weight:700;font-size:0.88rem;color:var(--charcoal);}
.vb-branch-loc{font-size:0.76rem;color:var(--slate-light);}
.vb-review-reply-toggle{display:inline-flex;align-items:center;gap:0.3rem;margin-top:0.6rem;font-size:0.8rem;font-weight:600;color:var(--saffron);cursor:pointer;}
.vb-review-reply-toggle .chev{display:inline-block;transition:transform 0.2s;}
.vb-outlet-badges{display:flex;flex-wrap:wrap;gap:0.4rem;margin-top:0.4rem;}
.vb-outlet-badge{font-size:0.72rem;padding:0.25rem 0.6rem;border-radius:999px;background:var(--cream-dark);color:var(--charcoal);}

.vb-about-field{margin-bottom:1.4rem;}
.vb-about-field:last-child{margin-bottom:0;}
.vb-about-label{display:block;font-weight:700;font-size:0.85rem;color:var(--charcoal);margin-bottom:0.4rem;}
.vb-about-field p{color:var(--slate-mid);font-size:0.9rem;line-height:1.6;}

/* Tab bar: bordered pill buttons instead of the site-wide underline-tab style
   (overrides main.css's shared .tab-bar/.tab-btn, scoped to this page only),
   and sticks to the top of the viewport — right below the main nav — once
   scrolling would otherwise carry it out of view, instead of just scrolling
   away with the rest of the page. */
.tab-bar{position:sticky;top:var(--vb-nav-height,64px);z-index:50;background:var(--cream);display:flex;gap:0.6rem;border-bottom:1px solid var(--border-light);margin-bottom:1.5rem;padding:0.75rem 0;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.tab-btn{padding:0.6rem 1.15rem;border:1.5px solid var(--border);border-radius:999px;background:white;color:var(--charcoal);font-weight:600;font-size:0.85rem;margin-bottom:0;white-space:nowrap;flex-shrink:0;transition:all var(--transition);}
.tab-btn:hover{border-color:var(--saffron);}
.tab-btn.active{background:var(--saffron);border-color:var(--saffron);color:white;}

/* Mobile: denser product/gallery/branch grids so tiles stay legible at full width,
   and a tighter 2x2 action-icon grid. */
@media(max-width:600px){
  .vb-prod-group-grid{grid-template-columns:repeat(2,1fr);gap:0.6rem;}
  #gallery-grid{grid-template-columns:repeat(4,1fr) !important;gap:0.5rem;}
  .vb-branch-grid{grid-template-columns:repeat(3,1fr);gap:0.5rem;}
  .vb-branch-photo{width:56px;height:56px;}
  .vb-branch-card{padding:0.8rem 0.4rem;gap:0.4rem;}
  .vb-branch-name{font-size:0.76rem;}
  .vb-branch-loc{font-size:0.66rem;}
  .vb-outlet-box{font-size:0.78rem;}
  .vb-outlet-box h4{font-size:0.9rem;}
  .product-img{height:90px;font-size:1.5rem;}
  .product-body{padding:0.6rem;}
  .product-name{font-size:0.74rem;}
  .product-desc{display:none;}
  .product-price{font-size:0.78rem;}
  .add-to-cart-btn{width:24px;height:24px;font-size:1rem;}
  .tab-btn{padding:0.5rem 0.85rem;font-size:0.78rem;}
}

html[data-theme="dark"] body{background:#1F2222;}
html[data-theme="dark"] #content > div,html[data-theme="dark"] .dash-card{background:#242727;border-color:#3A3D3D;}
html[data-theme="dark"] .tab-bar{background:#1F2222;border-color:#3A3D3D;}
html[data-theme="dark"] .tab-btn{background:#242727;border-color:#3A3D3D;color:#D0D0D0;}
html[data-theme="dark"] .tab-btn.active{background:var(--saffron);border-color:var(--saffron);color:white;}
html[data-theme="dark"] .vb-outlet-badge{background:#2E3131;color:#D0D0D0;}
html[data-theme="dark"] .vb-branch-card{background:#242727;border-color:#3A3D3D;}
html[data-theme="dark"] .vb-branch-name{color:#F0F0F0;}
html[data-theme="dark"] .vb-action-btn{background:#242727;border-color:#3A3D3D;color:#D0D0D0;}
html[data-theme="dark"] .vb-order-bar{background:#242727;border-color:#3A3D3D;}
html[data-theme="dark"] .vb-order-bar-body{border-color:#3A3D3D;}
</style>
</head>
<body>
<nav class="vb-nav" id="vb-nav"></nav>

<div id="loading" style="text-align:center;padding:5rem;"><div class="spinner" style="margin:0 auto;"></div></div>
<div id="content" style="display:none;">
  <div id="biz-banner-wrap" style="background:var(--cream-dark);overflow:hidden;position:relative;">
    <img id="banner" src="" alt="" style="width:100%;height:100%;object-fit:cover;display:none;">
    <div id="banner-placeholder" style="width:100%;height:100%;background:linear-gradient(135deg,var(--charcoal),#3D4141);"></div>
  </div>
  <div style="background:white;border-bottom:1px solid var(--border);">
    <div class="container" style="padding-top:1rem;padding-bottom:1.25rem;">
      <div style="display:flex;gap:1.5rem;align-items:flex-start;flex-wrap:wrap;">
        <div id="logo" style="border-radius:12px;background:var(--saffron-light);display:flex;align-items:center;justify-content:center;border:3px solid white;box-shadow:var(--shadow-md);flex-shrink:0;position:relative;overflow:hidden;"></div>
        <div style="flex:1;min-width:200px;">
          <div class="vb-name-row">
            <h1 id="biz-name" style="font-family:var(--font-body);font-weight:700;"></h1>
            <span id="biz-rating" style="display:inline-flex;align-items:center;gap:0.3rem;padding:0.3rem 0.7rem;border-radius:999px;background:var(--teal-light);color:var(--teal);font-size:0.78rem;font-weight:700;"></span>
          </div>
          <div class="vb-pills-row">
            <span id="biz-cat" style="display:inline-flex;align-items:center;gap:0.4rem;padding:0.3rem 0.8rem;border-radius:999px;border:1.5px solid var(--border);font-size:0.78rem;"></span>
            <span id="biz-status" style="display:inline-flex;align-items:center;gap:0.4rem;padding:0.3rem 0.8rem;border-radius:999px;border:1.5px solid var(--border);font-size:0.78rem;"></span>
          </div>
          <div id="biz-location" style="display:flex;align-items:center;gap:0.35rem;font-size:0.8rem;color:var(--slate-light);margin-bottom:0.4rem;"></div>
          <p id="biz-short" style="color:var(--slate-mid);font-size:0.9rem;"></p>
        </div>
      </div>

      <div class="vb-action-outlet-row">
        <div class="vb-action-grid">
          <a id="call-btn" href="#" class="vb-action-btn" style="display:none;" title="Call"><span id="ic-call"></span></a>
          <a id="wa-btn" href="#" target="_blank" class="vb-action-btn" style="display:none;" title="WhatsApp"><span id="ic-wa"></span></a>
          <a id="maps-btn" href="#" target="_blank" class="vb-action-btn" title="Directions"><span id="ic-maps"></span></a>
          <button id="save-btn" onclick="toggleSaveB()" class="vb-action-btn" title="Save"><span id="ic-save"></span></button>
        </div>
        <div class="vb-outlet-box dash-card">
          <h4>Outlet Info</h4>
          <div id="sidebar-today-hours" style="font-size:0.82rem;font-weight:600;margin-bottom:0.6rem;"></div>
          <div class="vb-outlet-badges" id="sidebar-badges" style="margin-bottom:0.6rem;"></div>
          <div id="sidebar-info" style="display:flex;flex-direction:column;gap:0.5rem;font-size:0.85rem;"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="container" style="padding-top:2rem;padding-bottom:6rem;">
    <div class="tab-bar">
      <button class="tab-btn active" id="tabbtn-products" onclick="showTab('products',this)"> Product</button>
      <button class="tab-btn" id="tabbtn-about" onclick="showTab('about',this)"> About</button>
      <button class="tab-btn" id="tabbtn-gallery" onclick="showTab('gallery',this)"> Gallery</button>
      <button class="tab-btn" id="tabbtn-branches" onclick="showTab('branches',this)"> Branches</button>
      <button class="tab-btn" id="tabbtn-reviews" onclick="showTab('reviews',this)"> Review</button>
    </div>
    <div id="tab-products" class="tab-content active">
      <div id="products-grid"></div>
    </div>
    <div id="tab-about" class="tab-content">
      <div class="dash-card">
        <h3 style="margin-bottom:1.25rem;font-family:var(--font-body);">About</h3>
        <div class="vb-about-field"><span class="vb-about-label">Short Description</span><p id="biz-short-about"></p></div>
        <div class="vb-about-field"><span class="vb-about-label">Long Description</span><p id="biz-desc"></p></div>
        <div class="vb-about-field" id="field-contact-no" style="display:none;"><span class="vb-about-label">Contact No.</span><p id="biz-contact-no"></p></div>
        <div class="vb-about-field" id="field-website" style="display:none;"><span class="vb-about-label">Website</span><p><a id="biz-website-link" href="#" target="_blank"></a></p></div>
        <div class="vb-about-field" id="field-mail" style="display:none;"><span class="vb-about-label">Mail</span><p id="biz-mail-text"></p></div>
        <div class="vb-about-field" id="field-social" style="display:none;"><span class="vb-about-label">Social</span><div id="contacts" style="display:flex;flex-wrap:wrap;gap:0.5rem;"></div></div>
        <div class="vb-about-field"><span class="vb-about-label">Opening Hour</span><div id="hours-list"></div></div>
        <div class="vb-about-field"><span class="vb-about-label">All Amenities</span><div id="biz-badges" style="display:flex;flex-wrap:wrap;gap:0.5rem;"></div></div>
        <div id="biz-parent-note" style="display:none;margin-top:0.75rem;font-size:0.85rem;color:var(--slate-light);"></div>
      </div>
    </div>
    <div id="tab-gallery" class="tab-content">
      <div id="gallery-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:0.75rem;"></div>
      <div id="gallery-empty" style="display:none;" class="empty-state"><div class="empty-icon">🖼️</div><h3>No photos yet</h3></div>
    </div>
    <div id="tab-branches" class="tab-content">
      <div class="dash-card">
        <h3 style="margin-bottom:1rem;font-family:var(--font-body);">Branches</h3>
        <div id="branches-list" class="vb-branch-grid"></div>
        <div id="branches-empty" style="display:none;padding:2rem;" class="empty-state"><div class="empty-icon">🏢</div><h3>No other branches</h3></div>
      </div>
    </div>
    <div id="tab-reviews" class="tab-content">
      <div style="background:white;border-radius:var(--radius-lg);border:1px solid var(--border);padding:1.5rem;margin-bottom:1.5rem;display:flex;gap:2rem;align-items:center;">
        <div style="text-align:center;"><div id="avg-big" style="font-size:3.5rem;font-weight:700;font-family:var(--font-display);">—</div><div id="avg-stars" style="color:#F59E0B;font-size:1.2rem;">☆☆☆☆☆</div><div id="rev-count" style="font-size:0.8rem;color:var(--slate-light);">No reviews</div></div>
      </div>
      <div id="review-form" style="display:none;background:white;border-radius:var(--radius-lg);border:1px solid var(--border);padding:1.5rem;margin-bottom:1.5rem;">
        <h4 style="font-family:var(--font-body);margin-bottom:1rem;">Write a Review</h4>
        <div style="display:flex;gap:0.5rem;margin-bottom:1rem;" id="star-pick">
          <span style="font-size:1.5rem;cursor:pointer;" onclick="setRating(1)">☆</span>
          <span style="font-size:1.5rem;cursor:pointer;" onclick="setRating(2)">☆</span>
          <span style="font-size:1.5rem;cursor:pointer;" onclick="setRating(3)">☆</span>
          <span style="font-size:1.5rem;cursor:pointer;" onclick="setRating(4)">☆</span>
          <span style="font-size:1.5rem;cursor:pointer;" onclick="setRating(5)">☆</span>
        </div>
        <input type="text" id="rev-title" class="form-input" placeholder="Summary (optional)" style="margin-bottom:0.75rem;">
        <textarea id="rev-content" class="form-input" rows="3" placeholder="Share your experience..." style="resize:vertical;"></textarea>
        <button onclick="submitReview()" class="btn btn-primary btn-sm" style="margin-top:0.75rem;">Submit Review</button>
      </div>
      <div id="reviews-list"></div>
    </div>
  </div>
</div>

<div class="vb-order-bar" id="order-bar" style="display:none;">
  <div class="vb-order-bar-header" onclick="toggleOrderBar()">
    <h4>Orders / Appointment / Booking</h4>
    <span class="vb-order-bar-summary" id="order-bar-summary"></span>
    <span class="vb-order-bar-chev" id="order-bar-chev"></span>
  </div>
  <div class="vb-order-bar-body" id="order-bar-body">
    <p id="order-subtitle" style="font-size:0.82rem;color:var(--slate-light);margin-bottom:0.75rem;">Add items from the Product tab</p>
    <div id="mini-cart" style="max-height:220px;overflow-y:auto;margin-bottom:1rem;"></div>
    <div id="mini-total" style="display:none;border-top:1px solid var(--border);padding-top:0.75rem;margin-bottom:0.75rem;">
      <div style="display:flex;justify-content:space-between;font-size:0.875rem;"><span>Subtotal</span><span id="mini-sub" style="font-weight:700;color:var(--saffron);"></span></div>
    </div>
    <button onclick="goCheckout()" id="checkout-btn" class="btn btn-primary" style="width:100%;justify-content:center;display:none;">Proceed to Checkout →</button>
  </div>
</div>

<div class="toast-container"></div>

<script src="/js/app.js"></script>
<script>
const slug = new URLSearchParams(window.location.search).get('slug');
if (!slug) window.location.href = '/';
let biz = null, selRating = 0;

document.getElementById('tabbtn-products').innerHTML = uiIcon('menu') + ' Product';
document.getElementById('tabbtn-about').innerHTML = uiIcon('about') + ' About';
document.getElementById('tabbtn-gallery').innerHTML = uiIcon('gallery') + ' Gallery';
document.getElementById('tabbtn-branches').innerHTML = uiIcon('branch') + ' Branches';
document.getElementById('tabbtn-reviews').innerHTML = uiIcon('reviews') + ' Review';
document.getElementById('ic-save').innerHTML = plainIcon('heart', 22);
document.getElementById('ic-wa').innerHTML = plainIcon('message', 22);
document.getElementById('ic-call').innerHTML = plainIcon('phone', 22);
document.getElementById('ic-maps').innerHTML = plainIcon('directions', 22);
document.getElementById('order-bar-chev').innerHTML = plainIcon('chevronDown', 16);

function syncNavHeight() {
  const nav = document.getElementById('vb-nav');
  if (nav) document.documentElement.style.setProperty('--vb-nav-height', nav.offsetHeight + 'px');
}

async function init() {
  renderVbNavbar('vb-nav');
  syncNavHeight();
  window.addEventListener('resize', syncNavHeight);
  const resp = await API.getBusiness(slug);
  if (!resp.ok) { document.getElementById('loading').innerHTML = '<div class="empty-state"><div class="empty-icon">😕</div><h3>Not found</h3><a href="/" class="btn btn-primary" style="margin-top:1rem;">Go Home</a></div>'; return; }
  biz = resp.data;
  document.title = `${biz.name} — V-Bazaar`;
  document.getElementById('loading').style.display = 'none';
  document.getElementById('content').style.display = 'block';
  render();
  loadProducts();
  loadReviews();
  if (Auth.isLoggedIn()) document.getElementById('review-form').style.display = 'block';
  renderMiniCart();
}

function render() {
  const b = biz;
  if (b.banner) { const img = document.getElementById('banner'); img.src = b.banner; img.style.display = 'block'; document.getElementById('banner-placeholder').style.display = 'none'; }
  const logoEl = document.getElementById('logo');
  if (b.logo) logoEl.innerHTML = `<img src="${b.logo}" style="width:100%;height:100%;object-fit:cover;">`;
  else logoEl.innerHTML = categoryIcon(b.category?.slug, 40);
  document.getElementById('biz-name').innerHTML = `${b.name}${b.is_verified ? ' ' + coloredIcon('about',18,'var(--saffron)') : ''}`;
  document.getElementById('biz-short').textContent = b.short_description || '';
  document.getElementById('biz-short-about').textContent = b.short_description || 'Not provided';
  document.getElementById('biz-desc').textContent = b.description || 'Not provided';
  document.getElementById('biz-cat').innerHTML = `${categoryIcon(b.category?.slug, 15)} ${b.category?.name || 'Business'}`;
  document.getElementById('biz-location').innerHTML = b.city ? `${uiIcon('location',13)} ${b.address ? b.address + ', ' : ''}${b.city}` : '';
  if (b.is_open !== null) document.getElementById('biz-status').innerHTML = b.is_open ? '<span style="color:var(--success);">● Open</span>' : '<span style="color:var(--danger);">● Closed</span>';
  if (b.accepts_orders === false) document.getElementById('order-subtitle').innerHTML = '<span style="color:var(--danger);font-weight:600;">Not accepting orders right now</span>';
  document.getElementById('biz-rating').innerHTML = b.average_rating > 0 ? `${plainIcon('starFilled',12)} ${parseFloat(b.average_rating).toFixed(1)} Rate` : `${plainIcon('starFilled',12)} No reviews`;
  document.getElementById('avg-big').textContent = b.average_rating > 0 ? parseFloat(b.average_rating).toFixed(1) : '—';
  document.getElementById('avg-stars').textContent = b.average_rating > 0 ? UI.stars(b.average_rating) : '☆☆☆☆☆';
  document.getElementById('rev-count').textContent = `${b.total_reviews} reviews`;
  const mapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${b.latitude},${b.longitude}`;
  document.getElementById('maps-btn').href = mapsUrl;
  if (b.whatsapp) { const wa = document.getElementById('wa-btn'); wa.href = `https://wa.me/${b.whatsapp.replace(/\D/g,'')}`; wa.style.display = 'flex'; }
  if (b.phone) { const ca = document.getElementById('call-btn'); ca.href = `tel:${b.phone}`; ca.style.display = 'flex'; }
  if (b.is_saved) document.getElementById('save-btn').classList.add('saved');

  // Hours
  const days = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
  const today = new Date().getDay();
  const todayIdx = today === 0 ? 6 : today - 1;
  document.getElementById('hours-list').innerHTML = b.hours?.length
    ? b.hours.map(h => `<div style="display:flex;justify-content:space-between;padding:0.6rem 0;border-bottom:1px solid var(--border-light);font-size:0.875rem;${h.day===todayIdx?'background:var(--saffron-light);margin:0 -0.5rem;padding:0.6rem 0.5rem;border-radius:6px;':''}"><span style="font-weight:600;">${days[h.day]}${h.day===todayIdx?' (Today)':''}</span><span>${h.is_closed?'<span style="color:var(--danger);">Closed</span>':`${h.open_time?.slice(0,5)} – ${h.close_time?.slice(0,5)}`}</span></div>`).join('')
    : '<p style="color:var(--slate-light);font-size:0.875rem;">Hours not specified</p>';
  const todayHours = b.hours?.find(h => h.day === todayIdx);
  document.getElementById('sidebar-today-hours').innerHTML = todayHours
    ? (todayHours.is_closed ? '<span style="color:var(--danger);">Closed today</span>' : `Today: ${todayHours.open_time?.slice(0,5)} – ${todayHours.close_time?.slice(0,5)}`)
    : '';

  // About tab fields — Contact No / Website / Mail / Social, each shown only when present
  if (b.phone) { document.getElementById('field-contact-no').style.display = 'block'; document.getElementById('biz-contact-no').textContent = b.phone; }
  if (b.website) { document.getElementById('field-website').style.display = 'block'; const wl = document.getElementById('biz-website-link'); wl.href = b.website; wl.textContent = b.website; }
  if (b.email) { document.getElementById('field-mail').style.display = 'block'; document.getElementById('biz-mail-text').textContent = b.email; }
  const cs = [];
  if (b.facebook) cs.push(`<a href="${b.facebook}" target="_blank" style="display:inline-flex;align-items:center;gap:0.4rem;padding:0.4rem 0.875rem;border-radius:999px;background:var(--cream-dark);font-size:0.82rem;color:inherit;">${uiIcon('facebook',15)} Facebook</a>`);
  if (b.instagram) cs.push(`<a href="${b.instagram}" target="_blank" style="display:inline-flex;align-items:center;gap:0.4rem;padding:0.4rem 0.875rem;border-radius:999px;background:var(--cream-dark);font-size:0.82rem;color:inherit;">${uiIcon('instagram',15)} Instagram</a>`);
  if (cs.length) { document.getElementById('field-social').style.display = 'block'; document.getElementById('contacts').innerHTML = cs.join(''); }

  // Feature badges
  const fb = [];
  if (b.card_payment === 'yes') fb.push('💳 Accepts Card Payments');
  if (b.free_wifi === 'yes') fb.push('📶 Free WiFi');
  if (b.smoking === 'yes') fb.push('🚬 Smoking Allowed');
  if (b.offer_package === 'yes') fb.push('📦 Takeaway/Parcel Available');
  if (b.offer_delivery === true) fb.push('🚚 Delivery Available');
  if (b.has_parking === true) fb.push('🅿️ Parking');
  if (b.is_registered === true) fb.push('✅ Registered Business');
  document.getElementById('biz-badges').innerHTML = fb.map(f => `<span style="display:inline-flex;align-items:center;gap:0.4rem;padding:0.35rem 0.8rem;border-radius:999px;background:var(--cream-dark);font-size:0.78rem;">${f}</span>`).join('');
  document.getElementById('sidebar-badges').innerHTML = fb.map(f => `<span class="vb-outlet-badge">${f}</span>`).join('');

  // Parent / branches
  const parentNote = document.getElementById('biz-parent-note');
  if (b.parent_name) {
    parentNote.innerHTML = `🏢 A branch of <a href="/business/?slug=${b.parent_slug}" style="color:var(--saffron);font-weight:600;">${b.parent_name}</a>`;
    parentNote.style.display = 'block';
  }
  if (b.branches?.length) {
    document.getElementById('branches-list').innerHTML = b.branches.map(br => `<a href="/business/?slug=${br.slug}" class="vb-branch-card">
      <div class="vb-branch-photo">${br.logo ? `<img src="${br.logo}" alt="${br.name}">` : categoryIcon(b.category?.slug, 28)}</div>
      <div class="vb-branch-name">${br.name}</div>
      <div class="vb-branch-loc">${br.city || ''}</div>
    </a>`).join('');
  } else {
    document.getElementById('branches-empty').style.display = 'block';
  }

  // Outlet Info — Opening Hour (sidebar-today-hours, set above) + amenities
  // (sidebar-badges, set above) + Total Views + Total Order Completed only.
  document.getElementById('sidebar-info').innerHTML = [
    `<div>${uiIcon('eye',15)} ${b.total_views || 0} Total Views</div>`,
    `<div>${uiIcon('cart',15)} ${b.total_orders || 0} Total Order Completed</div>`,
  ].join('');

  // Gallery
  if (b.gallery?.length) document.getElementById('gallery-grid').innerHTML = b.gallery.map(img => `<div style="aspect-ratio:1;border-radius:var(--radius-sm);overflow:hidden;cursor:pointer;" onclick="window.open('${img.image}','_blank')"><img src="${img.image}" style="width:100%;height:100%;object-fit:cover;transition:transform 0.2s;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform=''"></div>`).join('');
  else document.getElementById('gallery-empty').style.display = 'block';
}

async function loadProducts() {
  const resp = await API.getProducts(slug);
  const grid = document.getElementById('products-grid');
  const prods = resp.data?.results || resp.data || [];
  if (!prods.length) { grid.innerHTML = `<div class="empty-state" style="padding:2rem;"><div class="empty-icon">${categoryIcon(biz.category?.slug, 40)}</div><h3>No products listed</h3></div>`; return; }
  const card = p => renderProductCard(p, biz.id, biz.name, biz.category?.slug, biz.accepts_orders);

  const catMap = new Map();
  let anyCategorized = false;
  prods.forEach(p => {
    if (p.category) anyCategorized = true;
    const key = p.category || 'none';
    if (!catMap.has(key)) catMap.set(key, { name: p.category_name || 'Uncategorized', order: p.category_name ? (p.category_order || 0) : 999999, items: [] });
    catMap.get(key).items.push(p);
  });
  const groups = [...catMap.values()].sort((a, b) => a.order - b.order || a.name.localeCompare(b.name));

  // Show category headers as soon as ANY product has a category — even just one —
  // since that category name is exactly what the business owner set up to show.
  // Only fall back to a flat ungrouped grid when the business hasn't used categories at all.
  grid.innerHTML = anyCategorized
    ? groups.map(g => `<div class="vb-prod-group-title">${g.name}</div><div class="vb-prod-group-grid">${g.items.map(card).join('')}</div>`).join('')
    : `<div class="vb-prod-group-grid">${prods.map(card).join('')}</div>`;
}

async function loadReviews() {
  const resp = await API.getReviews(slug);
  const reviews = resp.data?.results || resp.data || [];
  const list = document.getElementById('reviews-list');
  if (!reviews.length) { list.innerHTML = '<div class="empty-state"><div class="empty-icon">💬</div><h3>No reviews yet</h3><p>Be the first to review!</p></div>'; return; }
  list.innerHTML = reviews.map(r => `<div class="review-card"><div class="review-header"><div class="reviewer-avatar">${(r.customer_name||'U')[0].toUpperCase()}</div><div><div class="reviewer-name">${r.customer_name||'Customer'}</div><div class="review-date">${UI.timeAgo(r.created_at)}</div></div><div style="margin-left:auto;display:flex;align-items:center;gap:0.9rem;flex-shrink:0;"><div class="stars-display">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</div>${r.owner_reply?`<div class="vb-review-reply-toggle" onclick="toggleReply(this)">Reply <span class="chev">⌄</span></div>`:''}</div></div>${r.title?`<div style="font-weight:600;font-size:0.875rem;margin-bottom:0.4rem;">${r.title}</div>`:''}<div class="review-content">${r.content}</div>${r.owner_reply?`<div class="owner-reply" style="display:none;"><strong>🏪 Owner:</strong> ${r.owner_reply}</div>`:''}</div>`).join('');
}

function toggleReply(el) {
  const reply = el.nextElementSibling;
  const open = reply.style.display === 'block';
  reply.style.display = open ? 'none' : 'block';
  el.querySelector('.chev').style.transform = open ? '' : 'rotate(180deg)';
}

function setRating(n) {
  selRating = n;
  document.querySelectorAll('#star-pick span').forEach((s, i) => { s.textContent = i < n ? '★' : '☆'; s.style.color = i < n ? '#F59E0B' : ''; });
}

async function submitReview() {
  if (!selRating) { UI.toast('Please select a rating', 'error'); return; }
  const content = document.getElementById('rev-content').value;
  if (!content) { UI.toast('Please write your review', 'error'); return; }
  const resp = await API.createReview(slug, { rating: selRating, title: document.getElementById('rev-title').value, content });
  if (resp.ok) { UI.toast('Review submitted!', 'success'); document.getElementById('review-form').style.display = 'none'; loadReviews(); }
  else UI.toast(resp.data?.non_field_errors?.[0] || 'Could not submit review.', 'error');
}

async function toggleSaveB() {
  if (!Auth.isLoggedIn()) { window.location.href = '/login/'; return; }
  const resp = await API.toggleSave(biz.id);
  if (resp.ok) {
    document.getElementById('save-btn').classList.toggle('saved', resp.data.saved);
    UI.toast(resp.data.saved ? 'Business saved!' : 'Removed from saved');
  }
}

function showTab(name, btn) {
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  btn.classList.add('active');
}

function toggleOrderBar() {
  document.getElementById('order-bar').classList.toggle('open');
}

function renderMiniCart() {
  const cart = Cart.get();
  const bar = document.getElementById('order-bar');
  const mini = document.getElementById('mini-cart');
  const totalDiv = document.getElementById('mini-total');
  const btn = document.getElementById('checkout-btn');
  if (!cart.items.length || cart.businessId !== biz?.id) { bar.style.display = 'none'; bar.classList.remove('open'); return; }
  bar.style.display = 'flex';
  const count = cart.items.reduce((s,i) => s+i.qty, 0);
  const sub = cart.items.reduce((s,i) => s+i.price*i.qty, 0);
  document.getElementById('order-bar-summary').textContent = `${count} item${count!==1?'s':''} · ${UI.formatPrice(sub)}`;
  mini.innerHTML = cart.items.map(i => `<div style="display:flex;justify-content:space-between;align-items:center;padding:0.4rem 0;font-size:0.82rem;border-bottom:1px solid var(--border-light);"><span style="font-weight:600;">${i.name}</span><div style="display:flex;align-items:center;gap:0.3rem;flex-shrink:0;"><button class="qty-btn" onclick="mQty(${i.id},${i.qty-1})">−</button><span>${i.qty}</span><button class="qty-btn" onclick="mQty(${i.id},${i.qty+1})">+</button><span style="color:var(--saffron);font-weight:700;min-width:60px;text-align:right;">${UI.formatPrice(i.price*i.qty)}</span></div></div>`).join('');
  document.getElementById('mini-sub').textContent = UI.formatPrice(sub);
  totalDiv.style.display = 'block'; btn.style.display = 'flex';
}

function mQty(id, qty) { Cart.updateQty(id, qty); renderMiniCart(); updateCartBadge(); }
function goCheckout() { if (!Auth.isLoggedIn()) { window.location.href = '/login/'; return; } window.location.href = '/checkout/'; }

// Override addToCart to also update mini cart
const _orig = window.addToCart;
window.addToCart = function(p, bizId, bizName) {
  const ok = Cart.add(p, bizId, bizName);
  if (ok) { UI.toast(`${p.name} added!`, 'success'); updateCartBadge(); document.getElementById('order-bar').classList.add('open'); renderMiniCart(); }
};

init();
</script>
</body>
</html>
